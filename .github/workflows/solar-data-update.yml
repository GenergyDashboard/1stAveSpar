# .github/workflows/solar-data-update.yml
name: Update Solar Data
on:
  schedule:
    # 08:00-08:10 SAST = 06:00 UTC
    - cron: '0 6 * * *'
    # 13:00-13:10 SAST = 11:00 UTC
    - cron: '0 11 * * *'
    # 20:00-20:10 SAST = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
     contents: write
jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Add random delay (0-10 minutes)
        run: |
          DELAY=$((RANDOM % 600))
          echo "⏱️ Waiting $DELAY seconds ($(($DELAY / 60)) minutes) before starting..."
          sleep $DELAY
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install playwright pandas openpyxl xlrd bcrypt requests
          playwright install chromium
          playwright install-deps
      
      - name: Run scraper
        env:
          SOLIS_USERNAME: ${{ secrets.SOLIS_USERNAME }}
          SOLIS_PASSWORD: ${{ secrets.SOLIS_PASSWORD }}
        run: |
          python scraper.py
      
      - name: Process data and generate stats
        run: |
          python process_data.py
      
      - name: Generate client auth file
        run: |
          echo '{"username":"${{ secrets.CLIENT_USERNAME }}","password":"${{ secrets.CLIENT_PASSWORD }}"}' > data/client_auth.json
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update solar data - $(date +'%Y-%m-%d %H:%M')" && git pull --rebase origin main && git push)
