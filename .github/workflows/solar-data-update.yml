name: Scrape SolisCloud Data

on:
  schedule:
    # 20:00 SAST daily
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solis-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright browser (Chromium)
        run: python -m playwright install --with-deps chromium

      - name: Run SolisCloud scraper
        env:
          SOLIS_USERNAME: ${{ secrets.SOLIS_USERNAME }}
          SOLIS_PASSWORD: ${{ secrets.SOLIS_PASSWORD }}
          TZ: Africa/Johannesburg
        run: python scraper.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: data/debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push data
        if: success()
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only data files — debug PNGs stay out of history
          git add data/daily/ 2>/dev/null || true
          git add data/solar_export_latest.* 2>/dev/null || true
          git add data/last_scrape.json 2>/dev/null || true
          git add data/auth_state_encoded.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update 1st Ave Spar solar data [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            git push
          fi

      - name: Upload scraped data artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: solar-data-${{ github.run_id }}
          path: |
            data/daily/*.xls
            data/daily/*.xlsx
            data/solar_export_latest.*
            data/last_scrape.json
          if-no-files-found: ignore
          retention-days: 30
