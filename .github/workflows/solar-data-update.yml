# .github/workflows/solar-data-update.yml
name: Update Solar Data

on:
  schedule:
    # Run 3 times a day (all times in UTC, South Africa is UTC+2)
    # 10:00 SAST = 08:00 UTC (Late morning)
    - cron: '0 8 * * *'
    # 15:00 SAST = 13:00 UTC (Mid afternoon)
    - cron: '0 13 * * *'
    # 20:00 SAST = 18:00 UTC (Evening)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
     contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install playwright pandas openpyxl xlrd bcrypt
          playwright install chromium
          playwright install-deps
      
      - name: Run scraper
        env:
          SOLIS_USERNAME: ${{ secrets.SOLIS_USERNAME }}
          SOLIS_PASSWORD: ${{ secrets.SOLIS_PASSWORD }}
        run: |
          python scraper.py
      
      - name: Process data and generate stats
        run: |
          python process_data.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update solar data - $(date +'%Y-%m-%d %H:%M')" && git push)
