# .github/workflows/solar-data-update.yml
name: Update Solar Data

on:
  schedule:
    # 08:00-08:10 SAST = 06:00 UTC
    - cron: '0 6 * * *'
    # 13:00-13:10 SAST = 11:00 UTC
    - cron: '0 11 * * *'
    # 20:00-20:10 SAST = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test Mode (T=immediate, F=random delay)'
        required: false
        default: 'T'
        type: choice
        options:
          - 'T'
          - 'F'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Add random delay (0-10 minutes)
        if: github.event.inputs.test_mode != 'T' && github.event_name != 'workflow_dispatch' || github.event.inputs.test_mode == 'F'
        run: |
          DELAY=$((RANDOM % 600))
          echo "⏱️ Waiting $DELAY seconds ($(($DELAY / 60)) minutes) before starting..."
          sleep $DELAY
      
      - name: Skip delay notification
        if: github.event.inputs.test_mode == 'T'
        run: |
          echo "🚀 Test Mode: Skipping random delay, running immediately!"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install playwright pandas openpyxl xlrd bcrypt requests
          playwright install chromium
          playwright install-deps
      
      - name: Run scraper
        env:
          SOLIS_USERNAME: ${{ secrets.SOLIS_USERNAME }}
          SOLIS_PASSWORD: ${{ secrets.SOLIS_PASSWORD }}
        run: |
          python scraper.py
      
      - name: Process data and generate stats
        run: |
          python process_data.py
      
      - name: Check file structure
        run: |
          echo "📁 Current directory: $(pwd)"
          echo ""
          echo "📂 Root files:"
          ls -la *.json 2>/dev/null || echo "No JSON files in root"
          echo ""
          echo "📂 Data directory:"
          ls -la data/*.json 2>/dev/null || echo "No JSON files in data/"
          echo ""
          echo "📂 XLS files (first 3):"
          ls -la data/daily/*.xls 2>/dev/null | head -3 || echo "No XLS files"
      
      - name: Migrate XLS data to daily records
        run: |
          if [ -f "dashboard_data.json" ]; then
            echo "✓ Found dashboard_data.json in root"
            python3 migrate_data.py dashboard_data.json data/daily
          elif [ -f "data/dashboard_data.json" ]; then
            echo "✓ Found dashboard_data.json in data/"
            python3 migrate_data.py data/dashboard_data.json data/daily
          else
            echo "⚠️ dashboard_data.json not found in root or data/"
            echo "Available files:"
            find . -name "*.json" -type f | head -10
            exit 1
          fi
      
      - name: Enhance with TOU and financial data
        run: |
          if [ -f "dashboard_data.json" ]; then
            echo "✓ Enhancing dashboard_data.json in root"
            python3 solar_processor_enhanced.py dashboard_data.json
          elif [ -f "data/dashboard_data.json" ]; then
            echo "✓ Enhancing dashboard_data.json in data/"
            python3 solar_processor_enhanced.py data/dashboard_data.json
          else
            echo "⚠️ dashboard_data.json not found!"
            exit 1
          fi
      
      - name: Generate client auth file
        run: |
          echo '{"username":"${{ secrets.CLIENT_USERNAME }}","password":"${{ secrets.CLIENT_PASSWORD }}"}' > data/client_auth.json
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git add dashboard_data.json 2>/dev/null || git add data/dashboard_data.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update solar data - $(date +'%Y-%m-%d %H:%M')" && git pull --rebase origin main && git push)
```

---

## ✅ What This Does

1. **Test Mode Toggle** - T = immediate, F = random delay (default: T)
2. **Runs Your Existing Steps** - Scraper → Process data
3. **Checks File Structure** - Shows where files are located
4. **Migrates Data** - Populates daily_records from XLS files
5. **Enhances Data** - Adds TOU and financial calculations
6. **Commits Everything** - Pushes updated data to GitHub

---

## 🚀 How to Use

1. **Copy the entire YML above**
2. **Replace your `.github/workflows/solar-data-update.yml`** with it
3. **Commit and push**
4. **Go to Actions tab → Update Solar Data → Run workflow**
5. **Select T (Test Mode)** and click Run

