# .github/workflows/solar-data-update.yml
name: Update Solar Data

on:
  schedule:
    # Run every hour from 03:00 to 19:00 UTC (05:00 to 21:00 SAST/UTC+2)
    - cron: '0 3-19 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test Mode (T=immediate, F=random delay)'
        required: false
        default: 'T'
        type: choice
        options:
          - 'T'
          - 'F'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Add random delay (0-10 minutes)
        if: github.event.inputs.test_mode != 'T' && github.event_name != 'workflow_dispatch' || github.event.inputs.test_mode == 'F'
        run: |
          DELAY=$((RANDOM % 600))
          echo "⏱️ Waiting $DELAY seconds ($(($DELAY / 60)) minutes) before starting..."
          sleep $DELAY
      
      - name: Skip delay notification
        if: github.event.inputs.test_mode == 'T'
        run: |
          echo "🚀 Test Mode: Skipping random delay, running immediately!"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install playwright pandas openpyxl xlrd bcrypt requests
          playwright install chromium
          playwright install-deps
      
      - name: Run scraper
        env:
          SOLIS_USERNAME: ${{ secrets.SOLIS_USERNAME }}
          SOLIS_PASSWORD: ${{ secrets.SOLIS_PASSWORD }}
        run: |
          python scraper.py
      
      - name: Process data and generate stats (legacy - optional)
        run: |
          if [ -f "process_data.py" ]; then
            echo "✓ Running legacy process_data.py"
            python process_data.py
          else
            echo "⚠️ process_data.py not found - using new migration pipeline instead"
          fi
      
      - name: Check file structure
        run: |
          echo "📁 Current directory: $(pwd)"
          echo ""
          echo "📂 Python scripts:"
          ls -la *.py 2>/dev/null || echo "No .py files in root"
          echo ""
          echo "📂 Root JSON files:"
          ls -la *.json 2>/dev/null || echo "No JSON files in root"
          echo ""
          echo "📂 Data directory:"
          ls -la data/*.json 2>/dev/null || echo "No JSON files in data/"
          echo ""
          echo "📂 XLS files (count):"
          ls data/daily/*.xls 2>/dev/null | wc -l || echo "0"
          echo ""
          echo "📂 Latest XLS:"
          ls -lt data/daily/*.xls 2>/dev/null | head -3 || echo "No XLS files"
      
      - name: Migrate XLS data to daily records
        run: |
          if [ ! -f "migrate_data.py" ]; then
            echo "⚠️ migrate_data.py not found - skipping migration"
            exit 0
          fi
          
          if [ -f "dashboard_data.json" ]; then
            echo "✓ Found dashboard_data.json in root"
            python3 migrate_data.py dashboard_data.json data/daily
          elif [ -f "data/dashboard_data.json" ]; then
            echo "✓ Found dashboard_data.json in data/"
            python3 migrate_data.py data/dashboard_data.json data/daily
          else
            echo "⚠️ dashboard_data.json not found"
            echo "Creating new dashboard_data.json..."
            echo '{"daily_records":[],"system":{"name":"1st Avenue Spar","capacity_kwp":71.59},"monthly_summaries":{},"lifetime_summary":{}}' > dashboard_data.json
            python3 migrate_data.py dashboard_data.json data/daily
          fi
      
      - name: Update irradiation from Open-Meteo API
        run: |
          if [ ! -f "update_irradiation.py" ]; then
            echo "⚠️ update_irradiation.py not found - skipping irradiation update"
            echo "   Predictions file will use existing/static irradiation data"
            exit 0
          fi
          
          if [ ! -f "predictions_2025_2044.min.json" ]; then
            echo "⚠️ predictions_2025_2044.min.json not found"
            echo "   Cannot update irradiation without predictions file"
            exit 0
          fi
          
          echo "📡 Fetching fresh irradiation data from Open-Meteo API..."
          python3 update_irradiation.py || {
            echo "⚠️ Irradiation update failed, continuing with existing data"
            exit 0
          }
      
      - name: Enhance with TOU and financial data
        run: |
          if [ ! -f "solar_processor_enhanced.py" ]; then
            echo "⚠️ solar_processor_enhanced.py not found - skipping enhancement"
            exit 0
          fi
          
          if [ -f "dashboard_data.json" ]; then
            echo "✓ Enhancing dashboard_data.json"
            python3 solar_processor_enhanced.py dashboard_data.json
          elif [ -f "data/dashboard_data.json" ]; then
            echo "✓ Enhancing data/dashboard_data.json"
            python3 solar_processor_enhanced.py data/dashboard_data.json
          else
            echo "⚠️ No dashboard_data.json to enhance"
          fi
      
      - name: Generate client auth file
        run: |
          mkdir -p data
          echo '{"username":"${{ secrets.CLIENT_USERNAME }}","password":"${{ secrets.CLIENT_PASSWORD }}"}' > data/client_auth.json
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git add predictions_2025_2044.min.json 2>/dev/null || true
          git add dashboard_data.json 2>/dev/null || git add data/dashboard_data.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update solar data - $(date +'%Y-%m-%d %H:%M SAST')" && git pull --rebase origin main && git push)
